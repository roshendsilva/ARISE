{% extends "base.html" %}

{% block title %}Sign In - ARISE Catholic Research Portal{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
        <div class="card-header navbar-arise text-white text-center py-4">
          <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="ARISE Logo" class="login-logo-img mb-3 d-block mx-auto">
          <h2 class="h4 brand-font mb-0">ARISE Portal Sign In</h2>
          <span class="small text-gold">Members, Inquirers & Administration</span>
        </div>
        <div class="card-body p-4">
          <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-body text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
              </div>
            </div>
            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center">
                <label for="password" class="form-label fw-semibold mb-0">Password</label>
              </div>
              <div class="input-group mt-1">
                <span class="input-group-text bg-body text-muted"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
              </div>
            </div>
            <button type="submit" class="btn btn-gold w-100 py-2.5 fw-bold text-navy">
              Sign In to Portal &rarr;
            </button>
          </form>
          
          <hr class="my-4 border-secondary-subtle">
          
          <div class="text-center">
            <p class="small text-muted mb-2">Don't have a research account yet?</p>
            <a href="{{ url_for('register') }}" class="btn btn-outline-gold btn-sm px-4">
              <i class="bi bi-person-plus me-1"></i> Create Free Account
            </a>
          </div>

          <div class="mt-4 pt-3 border-top text-center text-muted small">
            <div>Default Admin Login:</div>
            <code>admin@arise.org</code> | <code>admin123</code>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
