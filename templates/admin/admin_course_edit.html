{% extends 'base.html' %}

{% block title %}Admin — Create / Edit Course{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom border-secondary">
    <h1 class="h3 fw-bold text-warning mb-0" style="font-family: 'Cinzel', serif;">
      <i class="bi bi-pencil-square me-2"></i> Create New Course
    </h1>
    <a href="{{ url_for('admin_courses') }}" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left me-1"></i> Back to Courses
    </a>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="card bg-dark text-white border-secondary shadow-lg rounded-4 p-4 p-md-5">
        <form action="{{ url_for('admin_course_new') }}" method="POST">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label text-gold fw-bold">Course Title</label>
              <input type="text" name="title" class="form-control bg-slate-900 text-white border-secondary" placeholder="e.g., Marian Dogmas & Catholic Apologetics" required>
            </div>
            <div class="col-md-4">
              <label class="form-label text-gold fw-bold">URL Slug</label>
              <input type="text" name="slug" class="form-control bg-slate-900 text-white border-secondary" placeholder="e.g., marian-dogmas" required>
            </div>
            
            <div class="col-md-4">
              <label class="form-label text-gold fw-bold">Category</label>
              <input type="text" name="category" class="form-control bg-slate-900 text-white border-secondary" value="Catholic Theology">
            </div>
            <div class="col-md-4">
              <label class="form-label text-gold fw-bold">Difficulty</label>
              <select name="difficulty" class="form-select bg-slate-900 text-white border-secondary">
                <option value="Beginner">Beginner</option>
                <option value="Intermediate" selected>Intermediate</option>
                <option value="Advanced">Advanced</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label text-gold fw-bold">Estimated Duration</label>
              <input type="text" name="estimated_duration" class="form-control bg-slate-900 text-white border-secondary" value="10 Hours">
            </div>

            <div class="col-12">
              <label class="form-label text-gold fw-bold">Short Description</label>
              <input type="text" name="short_description" class="form-control bg-slate-900 text-white border-secondary" placeholder="Brief 1-sentence overview for cards">
            </div>

            <div class="col-12">
              <label class="form-label text-gold fw-bold">Full Course Description</label>
              <textarea name="description" rows="4" class="form-control bg-slate-900 text-white border-secondary" placeholder="Comprehensive course introduction..."></textarea>
            </div>
          </div>

          <div class="mt-4 text-end">
            <button type="submit" class="btn btn-warning btn-lg fw-bold px-5">
              <i class="bi bi-save-fill me-2"></i> Save Course
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
