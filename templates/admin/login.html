{% extends "base.html" %}

{% block title %}Admin Login - ARISE Portal{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
        <div class="card-header navbar-arise text-white text-center py-4">
          <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="ARISE Logo" class="login-logo-img mb-3 d-block mx-auto">
          <h2 class="h4 brand-font mb-0">ARISE Admin Portal</h2>
          <span class="small text-gold">Editorial & Content Management</span>
        </div>
        <div class="card-body p-4">
          <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-body text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email" placeholder="admin@arise.org" required>
              </div>
            </div>
            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-body text-muted"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
              </div>
            </div>
            <button type="submit" class="btn btn-gold w-100 py-2 fw-bold">Sign In to Dashboard &rarr;</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
